# Client authentication for the shared Postgres (mounted by shared-db.compose.yaml).
# First match wins; anything not matched is rejected.
#
# Edit the CIDR below to the developer-laptop subnet. Sandbox traffic leaves the laptop through
# the sbx proxy, so the server sees the LAPTOP's address, not the microVM's.

# TYPE   DATABASE  USER  ADDRESS            METHOD
# Socket inside the container: only reachable via `docker exec` by a host admin.
local    all       all                      trust
# Developers: TLS only, SCRAM only, from the dev subnet only.
hostssl  all       all   10.0.0.0/24        scram-sha-256
